[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
# testing file
[project]
name = "mcpaudit"
version = "1.0.0"
description = "MCP Server Security Auditor: Static Analysis, Prompt Injection Detection, Dynamic Probing, and Pin-and-Diff Rug-Pull Prevention."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Saad Momin", email = "Saadmomin940@gmail.com" },
    { name = "Sawez Farjad", email = "sawezfarjad@gmail.com" },
    { name = "Security Team", email = "security@brextherfx.site" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "auditor",
    "prompt-injection",
    "static-analysis",
    "dynamic-probing",
    "rug-pull-prevention",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "deepdiff>=7.0.0",
    "bandit>=1.7.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
]

[project.urls]
Homepage = "https://github.com/mcp-security/mcpaudit"
Documentation = "https://github.com/mcp-security/mcpaudit#readme"
Repository = "https://github.com/mcp-security/mcpaudit"
Issues = "https://github.com/mcp-security/mcpaudit/issues"

[project.scripts]
mcpaudit = "mcpaudit.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcpaudit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
