[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
# testing file
[project]
name = "mcpaudit"
version = "1.0.0"
description = "MCP Server Security Auditor: Static Analysis, Prompt Injection Detection, Dynamic Probing, and Pin-and-Diff Rug-Pull Prevention."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "deepdiff>=7.0.0",
    "bandit>=1.7.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
]

[project.scripts]
mcpaudit = "mcpaudit.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcpaudit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
